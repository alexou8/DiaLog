# Dependency update automation.
#
# Why this exists: AGENTS.md makes `npm audit` a manual step, and parse.ts
# already cites an advisory chain in fast-xml-parser. Weekly PRs mean a
# reachable advisory is noticed within days instead of whenever someone next
# remembers to look.
#
# Grouping keeps the volume reviewable: minor and patch updates arrive as one
# PR per ecosystem per week.
#
# npm majors are ignored on purpose. The first Dependabot run opened one PR per
# major (Next 16, Prisma 7, Vitest 5, Zod 4, ESLint 10) and every one failed
# CI for a known, structural reason — Prisma 7 moves datasource URLs out of
# the schema, ESLint 10 is not accepted by eslint-config-next 15, Vitest 5
# changes the config types. Those are planned migrations that need code
# changes, docs and a deliberate PR each, not a weekly bump that is red by
# construction. Patch and minor updates still arrive weekly; `npm outdated`
# shows the majors when someone is ready to take one on.
#
# Every PR runs the full CI workflow, so a bump that breaks the build, a type,
# a test or the production audit fails like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The research pipeline in ml/ is independent of the Node build and has its
  # own requirements.txt; it is not deployed, but it is tested in CI.
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
