name: CI

# `push: branches: ['**']` alongside `pull_request` ran the entire matrix
# twice for every commit on a PR branch. Concurrency alone does not dedupe
# them: the two events produce different group keys (a `push` has no
# `pull_request.number` and falls back to `github.ref`), so both runs survive.
# Restricting `push` to the default branch removes the duplicate at its
# source — PR branches are covered by the `pull_request` trigger, and `main`
# still gets a run per merge. A branch with no open PR gets no run, which is
# the intended trade.
on:
  push:
    branches: [main]
  pull_request:

# Still worth keeping, for a different case: successive pushes to the same PR.
# A newer commit cancels the in-progress run for the older one. Only for
# pull requests: every push to main must finish, because a cancelled run
# leaves that merge commit without a verdict. Keying main pushes by SHA (not
# by ref) matters too: a shared ref group allows one running plus one pending
# run, so a third quick merge would silently replace the pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for the default GITHUB_TOKEN. No job here writes to the
# repository, issues or packages; artifacts and caches use their own runtime
# credentials and need no token scope.
permissions:
  contents: read

env:
  # Shared across every job that needs a DB. Each DB-backed job names its own
  # disposable database (dialog_test for integration, dialog_e2e for e2e) so a
  # guard in each suite can refuse to wipe anything else.
  AUTH_SECRET: ci-only-secret-value-not-used-in-any-real-deployment
  AI_PROVIDER: local

jobs:
  # Fast, DB-free checks. No postgres service needed.
  quality:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Single source of truth for the Node major: `.nvmrc` (22). A bump
          # there moves every job at once instead of four hard-coded numbers.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # `prisma validate` reads the datasource env vars even though it never
      # connects, so placeholders are supplied. (`prisma format --check` is not
      # run here: it needs prisma/schema.prisma to be canonically formatted.)
      - name: Validate the Prisma schema
        env:
          DATABASE_URL: postgresql://validate:validate@127.0.0.1:5432/validate
          DIRECT_DATABASE_URL: postgresql://validate:validate@127.0.0.1:5432/validate
        run: npx prisma validate

      # Production dependencies only, high severity and above. Fails the build
      # on a reachable advisory instead of relying on someone remembering to
      # run `npm audit` (AGENTS.md, Dependencies). Dev-only advisories are
      # reported by Dependabot rather than gating merges.
      - name: Audit production dependencies
        run: npm run audit

  # Real-database integration/security suite. Only this job runs postgres for
  # that purpose (the e2e job runs its own, separate instance below).
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dialog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public
      TEST_DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Single source of truth for the Node major: `.nvmrc` (22). A bump
          # there moves every job at once instead of four hard-coded numbers.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy

      # `migrate deploy` only proves the migrations apply. It says nothing about
      # whether prisma/schema.prisma still matches them, so an index, onDelete or
      # nullability edit to the schema with no migration passes every other step
      # and is only discovered in production. Replay the migrations into a
      # separate, empty shadow database and diff the result against the schema;
      # `--exit-code` makes any difference exit 2.
      #
      # The shadow database is a second logical database on the same service
      # container, not dialog_test: Prisma applies the whole history to it, and
      # dialog_test already holds the migrated schema.
      - name: Check the schema has no drift from the migrations
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE dialog_shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url 'postgresql://postgres:postgres@127.0.0.1:5432/dialog_shadow?schema=public' \
            --exit-code

      - name: Integration tests
        run: npx vitest run --config vitest.integration.config.ts

  # Production build, shared with the e2e job below via upload/download-artifact
  # so `next build` runs exactly once per CI run instead of twice.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Single source of truth for the Node major: `.nvmrc` (22). A bump
          # there moves every job at once instead of four hard-coded numbers.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'prisma/schema.prisma', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: nextjs-build
          # `.next/cache` is excluded on purpose: it's large, and it's already
          # restored independently (and re-saved) by the actions/cache step
          # above, keyed on lockfile + source hash rather than on a single
          # run's artifact.
          path: |
            .next
            !.next/cache
          # `.next` is a dot-prefixed directory, and upload-artifact@v4 treats
          # everything under one as a hidden file and skips it by default. That
          # silently matched zero files and uploaded an empty artifact, which
          # only surfaced 45s later as "Artifact not found" in the e2e job.
          include-hidden-files: true
          # An empty match is a `##[warning]`, so the build job still reported
          # success while producing nothing. Fail here, at the real defect,
          # rather than in a downstream job.
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dialog_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_e2e?schema=public
      # What the suite itself reads. playwright.config.ts refuses to start
      # unless this names a disposable database (dialog_e2e or dialog_test),
      # because global-setup deletes every account in it; DATABASE_URL above is
      # only for `prisma migrate deploy` and is overwritten from this value.
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_e2e?schema=public
      # Tells playwright.config.ts's webServer to skip `npm run build` and go
      # straight to `next start`, since the `build` job's `.next` output is
      # downloaded below.
      PLAYWRIGHT_SKIP_BUILD: '1'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Single source of truth for the Node major: `.nvmrc` (22). A bump
          # there moves every job at once instead of four hard-coded numbers.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # `npm ci` doesn't run `prisma generate` a second time uselessly here —
      # postinstall already does it — but the downloaded .next below still
      # needs a Prisma client on disk, which postinstall provides.

      - uses: actions/download-artifact@v7
        with:
          name: nextjs-build
          path: .next

      # The e2e job starts a prebuilt `.next` rather than building one, so a
      # truncated or wrongly-rooted artifact would otherwise surface as an
      # opaque `next start` failure inside Playwright's webServer. Assert the
      # handoff here, where the cause is.
      - name: Verify the downloaded build
        run: |
          test -f .next/BUILD_ID || {
            echo "::error::.next/BUILD_ID missing after download-artifact — the build artifact is empty or wrongly rooted."
            ls -la .next || true
            exit 1
          }

      - run: npx prisma migrate deploy

      # Keyed on the installed Playwright version, not the whole lockfile: the
      # browser build only changes when Playwright does, and an unrelated
      # dependency bump should not force a re-download.
      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The suite seeds itself: tests/e2e/global-setup.ts resets the database
      # and re-seeds before any test runs, so a run never inherits state.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # On a cache hit the browser binary is already present, but the OS-level
      # shared libraries it needs (apt packages) are not cached, and are cheap
      # to reinstall on their own.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # A step-level timeout fails the step instead of cancelling the job. A
      # job-level timeout counts as a cancellation, and no `if` other than
      # `always()` runs after one, so the report below would never upload for
      # the exact hang it is meant to diagnose.
      - run: npm run test:e2e
        timeout-minutes: 17

      # `!cancelled()` rather than `failure()`: with the step timeout above a
      # hung suite fails the step, so this uploads the trace for exactly the
      # run that needs it. Uploading on success too keeps traces for passing
      # runs; there are no retries (playwright.config.ts), so nothing hides
      # behind a green result.
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          # Same reason as the build artifact above: without this, any
          # dot-prefixed entry in the report is dropped and the trace viewer
          # loads incomplete. Not paired with `if-no-files-found: error` —
          # a run that died before Playwright wrote a report (webServer
          # failed to start, for example) legitimately has none.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  research-pipeline:
    name: Python research pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Not path-filtered to ml/**: this job is a required check, and a
    # path-filtered job that gets skipped never reports a status, which can
    # leave a required check stuck pending on PRs that don't touch ml/. Always
    # running it costs a few extra minutes on unrelated PRs but keeps merges
    # unblocked; revisit if branch protection is reconfigured to tolerate
    # skipped required checks.
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
