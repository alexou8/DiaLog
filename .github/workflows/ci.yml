name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Web app (lint, types, unit, integration, build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dialog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public
      TEST_DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog_test?schema=public
      # Test-only value. Real deployments set this as a secret.
      AUTH_SECRET: ci-only-secret-value-not-used-in-any-real-deployment
      AI_PROVIDER: local

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npx vitest run --config vitest.integration.config.ts

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: web

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dialog
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialog?schema=public
      AUTH_SECRET: ci-only-secret-value-not-used-in-any-real-deployment
      AI_PROVIDER: local

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  research-pipeline:
    name: Python research pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
