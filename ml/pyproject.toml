[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialog-ml"
version = "0.1.0"
description = "DiaLog offline research / model-development pipeline (not deployed)."
# The pinned numpy/pandas/scikit-learn in requirements.txt need >=3.10 and ship
# wheels up to 3.13 only (no 3.14). Of that range CI runs 3.11 and 3.13 was
# verified by hand; 3.10 and 3.12 are untested, so they are not claimed.
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
include = ["src*"]
