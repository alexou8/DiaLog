<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="at ad" font-family="Inter, 'Liberation Sans', Helvetica, Arial, sans-serif">
  <title id="at">DiaLog architecture</title>
  <desc id="ad">Request flow from the Next.js routes through Server Actions and route handlers, into services, then the pure domain, import and analytics modules, then Prisma and PostgreSQL. Analytics output crosses a privacy boundary into an evidence bundle before the AI layer, so no raw health record ever reaches an AI provider.</desc>

  <rect width="1200" height="756" fill="#FBFAF6"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <g stroke="#8A9099" stroke-width="2" marker-end="url(#arrow)">
    <line x1="398" y1="130" x2="398" y2="160"/>
    <line x1="398" y1="254" x2="398" y2="284"/>
    <line x1="398" y1="358" x2="398" y2="388"/>
    <line x1="398" y1="502" x2="398" y2="532"/>
    <line x1="398" y1="606" x2="398" y2="636"/>
    <line x1="742" y1="444" x2="796" y2="444"/>
    <line x1="968" y1="502" x2="968" y2="532"/>
    <line x1="968" y1="606" x2="968" y2="636"/>
  </g>

  <g fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1.5">
    <rect x="56" y="58" width="684" height="72" rx="10"/>
    <rect x="56" y="160" width="684" height="94" rx="10"/>
    <rect x="56" y="284" width="684" height="74" rx="10"/>
    <rect x="56" y="388" width="684" height="114" rx="10"/>
    <rect x="56" y="532" width="684" height="74" rx="10"/>
    <rect x="56" y="636" width="684" height="62" rx="10"/>
    <rect x="796" y="532" width="348" height="74" rx="10"/>
    <rect x="796" y="636" width="348" height="62" rx="10"/>
  </g>

  <g font-size="19" font-weight="700" fill="#155E69">
    <text x="76" y="88">Routes — app/</text>
    <text x="76" y="190">Mutation path</text>
    <text x="76" y="314">Services — lib/services/</text>
    <text x="76" y="418">Pure modules (no database access)</text>
    <text x="76" y="562">lib/db/ — Prisma client + query helpers</text>
    <text x="816" y="562">lib/ai/</text>
  </g>

  <g font-size="16" fill="#5B6169">
    <text x="76" y="114">(marketing)/ public · (auth)/ sign-in &amp; sign-up · app/ the product · api/ route handlers</text>
    <text x="76" y="216">lib/actions/ — Server Actions, the mutation path for the app UI</text>
    <text x="76" y="240">app/api/ — route handlers. Session revocation lives here, never in a Server Action.</text>
    <text x="76" y="340">Orchestration between actions/routes and the lower-level libs</text>
    <text x="76" y="446">lib/import/ — parse → connector parse() → normalize → dedupe → summary</text>
    <text x="76" y="470">lib/domain/ — units (mg/dL ↔ mmol/L) · thresholds · evidence grading · dedupe</text>
    <text x="76" y="494">lib/analytics/ — engine.ts → glucose · associations · stats · ml/ → AnalyticsResult</text>
    <text x="76" y="588">Every query owner-scoped: where { id, userId }, never where { id } alone</text>
    <text x="816" y="588">prompts · Zod schemas · guardrails.ts · redact.ts</text>
  </g>

  <g font-size="17" font-weight="600" fill="#172126">
    <text x="76" y="674">PostgreSQL — glucose in mg/dL, mass in kg, volume in mL, duration in minutes</text>
    <text x="816" y="664" font-size="15">local — default, no network</text>
    <text x="816" y="686" font-size="15">anthropic · openai — opt-in only</text>
  </g>

  <rect x="796" y="388" width="348" height="114" rx="10" fill="#E8F2F3" stroke="#155E69" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="816" y="418" font-size="19" font-weight="700" fill="#155E69">Privacy boundary</text>
  <text x="816" y="446" font-size="16" fill="#155E69">AnalyticsResult / EvidenceBundle:</text>
  <text x="816" y="468" font-size="16" fill="#155E69">pre-aggregated and evidence-graded.</text>
  <text x="816" y="490" font-size="16" font-weight="600" fill="#155E69">No raw health record crosses it.</text>
</svg>
